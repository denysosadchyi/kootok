<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Куток · токени уроку 8</title>
<link rel="stylesheet" href="../design-system/index.css">
<link rel="stylesheet" href="/kootok/course-nav.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--color-page-background);color:var(--color-text-primary);font:var(--type-body)}
.tokens-page{width:min(100%,1040px);margin:auto;padding:var(--space-section-gap) var(--space-screen-gutter) 72px}.tokens-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-section-gap);align-items:end;margin-bottom:28px}.tokens-kicker{margin:0 0 var(--space-stack-xs);color:var(--color-action);font:var(--type-field-label)}.tokens-hero h1{max-width:22ch;margin:0;font:var(--type-page-title);letter-spacing:var(--primitive-letter-spacing-n02)}.tokens-hero p{max-width:42ch;margin:var(--space-stack-md) 0 0;color:var(--color-text-secondary);font:var(--type-support)}.theme-toggle{min-height:44px;padding:var(--primitive-length-10) var(--space-control-inline);border:0;border-radius:var(--radius-control);background:var(--color-action-surface);color:var(--color-on-action);font:var(--type-control-compact);cursor:pointer;white-space:nowrap}
.token-status{margin:0 0 22px;padding:var(--primitive-length-11) var(--primitive-length-14);border-radius:var(--radius-control);background:var(--color-info-background);color:var(--color-current-text);font:var(--type-field-label)}.level{margin:0 0 40px}.level-head{display:grid;grid-template-columns:52px minmax(0,1fr);gap:var(--primitive-length-14);align-items:start;margin-bottom:18px}.level-number{display:grid;width:48px;height:48px;place-items:center;border-radius:var(--radius-circle);background:var(--color-current-background);color:var(--color-current-text);font:var(--type-section-title)}.level h2{margin:0 0 var(--space-stack-xs);font:var(--type-detail-title)}.level-head p{margin:0;color:var(--color-text-secondary);font:var(--type-support)}
.specimens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--primitive-length-10);margin-bottom:22px}.specimen{min-height:112px;padding:var(--primitive-length-14) var(--space-control-inline);border-radius:var(--radius-card);background:var(--color-card-background)}.specimen h3{margin:0 0 var(--primitive-length-10);color:var(--color-text-secondary);font:var(--type-meta)}.specimen__type strong{display:block;font:var(--type-detail-title)}.specimen__type span{color:var(--color-text-secondary);font:var(--type-support)}.specimen__space{display:flex;align-items:end;gap:7px;height:54px}.specimen__space i{display:block;width:20px;border-radius:var(--space-stack-xs) var(--space-stack-xs) 0 0;background:var(--color-action)}.specimen__space i:nth-child(1){height:8px}.specimen__space i:nth-child(2){height:16px}.specimen__space i:nth-child(3){height:24px}.specimen__space i:nth-child(4){height:32px}.specimen__radius{width:82px;height:56px;border-radius:var(--radius-card);background:var(--color-current-background)}
.token-group{margin-top:18px}.token-group h3{margin:0 0 var(--space-stack-sm);font:var(--type-section-title)}.token-group h3 small{color:var(--color-text-secondary);font:var(--type-meta)}.table-wrap{max-width:100%;overflow-x:auto;border-radius:var(--radius-control);background:var(--color-card-background)}table{width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;text-align:left}th:first-child,td:first-child{width:36%}th:nth-child(2),td:nth-child(2){width:35%}th:nth-child(3),td:nth-child(3){width:29%}th,td{padding:8px 12px;vertical-align:top;border-bottom:1px solid var(--color-divider)}tr:last-child td{border-bottom:0}th{color:var(--color-text-secondary);font:var(--type-overline)}code{font-size:12px;line-height:1.35}td:first-child code{white-space:nowrap}td:nth-child(3){white-space:nowrap}.token-value{display:flex;align-items:center;gap:8px}.token-value>span{min-width:0;overflow-wrap:anywhere}.token-swatch{display:inline-block;flex:0 0 28px;width:28px;height:28px;border-radius:var(--radius-circle);background:var(--token-preview);outline:1px solid var(--color-hairline);outline-offset:-1px}.token-icon{display:inline-block;width:24px;height:24px;background:var(--color-action);-webkit-mask:var(--token-preview) center/contain no-repeat;mask:var(--token-preview) center/contain no-repeat}.semantic-map{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}.semantic-map span{padding:6px 10px;border-radius:var(--radius-pill);background:var(--color-current-background);color:var(--color-current-text);font:var(--type-chip)}
.load-error{padding:20px;border-radius:var(--primitive-length-16);background:var(--color-danger-background);color:var(--color-danger)}
@media(max-width:700px){.tokens-page{padding:22px 16px 56px}.tokens-hero{display:block;margin-bottom:24px}.theme-toggle{width:100%;margin-top:16px}.level-head{grid-template-columns:44px 1fr;gap:10px}.level-number{width:40px;height:40px}.level h2{font-size:23px}.specimens{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.specimen{min-height:90px;padding:10px}.specimen h3{margin-bottom:8px;font-size:11px}.specimen__type strong{font-size:17px}.specimen__type span{font-size:11px}.specimen__space{height:42px;gap:4px}.specimen__space i{width:12px}.specimen__radius{width:54px;height:42px}td:nth-child(3){white-space:normal}}
</style>
</head>
<body>
<main class="tokens-page" id="course-main">
  <header class="tokens-hero">
    <div><p class="tokens-kicker">Куток · урок 8</p><h1>Токени, що тримають весь продукт разом</h1><p>Primitive значення задають матеріал системи. Semantic ролі пояснюють його призначення компонентам і дозволяють темі змінюватися без переписування інтерфейсу.</p></div>
    <button class="theme-toggle" id="token-theme" type="button" aria-pressed="false">Темна тема</button>
  </header>
  <p class="token-status" id="token-status" role="status">Читаю token graph із tokens.css…</p>
  <div id="token-reference"></div>
</main>
<script type="module">
const root=document.documentElement,button=document.querySelector('#token-theme');
button.addEventListener('click',()=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';button.setAttribute('aria-pressed',String(dark));button.textContent=dark?'Світла тема':'Темна тема'});
const source=await fetch('/kootok/design-system/tokens.css').then(r=>{if(!r.ok)throw new Error(`tokens.css: HTTP ${r.status}`);return r.text()});
const indexCss=await fetch('/kootok/design-system/components/index.css').then(r=>r.text());
const modules=[...indexCss.matchAll(/@import\s+["']\.\/([\w-]+)\.css["']/g)].map(m=>m[1]);
const moduleCss=await Promise.all(modules.map(async name=>[name,await fetch(`/kootok/design-system/components/${name}.css`).then(r=>r.text())]));
const block=source.match(/:root\s*\{([\s\S]*?)\n\}/)?.[1]||'',tokens=[...block.matchAll(/(--[\w-]+)\s*:\s*([^;]+);/g)].map(([,name,value])=>({name,value:value.trim()}));
const primitive=tokens.filter(t=>t.name.startsWith('--primitive-')),semantic=tokens.filter(t=>!t.name.startsWith('--primitive-'));
const usage=name=>moduleCss.filter(([,css])=>css.includes(`var(${name})`)).map(([name])=>`${name}.css`).join(', ')||'foundation / alias';
const resolved=name=>getComputedStyle(root).getPropertyValue(name).trim();
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=[['Color primitives',t=>t.name.startsWith('--primitive-color-')||t.name.startsWith('--primitive-gradient-')],['Typography',t=>/^--primitive-(?:font|line-height|letter-spacing)/.test(t.name)],['Spacing',t=>t.name.startsWith('--primitive-length-')],['Radii & geometry',t=>/^--primitive-(?:radius|width|height|opacity|scale)/.test(t.name)],['Local icons',t=>t.name.startsWith('--primitive-icon-')]];
const seen=new Set(),categoryHtml=categories.map(([name,test])=>{const list=primitive.filter(test);list.forEach(t=>seen.add(t.name));return table(name,list)}).join(''),other=primitive.filter(t=>!seen.has(t.name));
document.querySelector('#token-reference').innerHTML=`<section class="level"><div class="level-head"><span class="level-number">1</span><div><h2>Primitive</h2><p>Палітра, типографіка, ритм, геометрія та локальна Solar icon library.</p></div></div>${specimens()}${categoryHtml}${other.length?table('Other primitives',other):''}</section><section class="level"><div class="level-head"><span class="level-number">2</span><div><h2>Semantic</h2><p>Стабільні ролі кольору, типографіки, ритму, радіусів та elevation. Компоненти звертаються до них, а не до сирих значень.</p></div></div><div class="semantic-map" aria-label="Напрями semantic ролей"><span>Canvas</span><span>Text</span><span>Type</span><span>Spacing</span><span>Radius</span><span>Elevation</span><span>State</span></div>${table('Semantic roles',semantic)}</section>`;
const icons=tokens.filter(t=>t.name.startsWith('--primitive-icon-'));
const iconFiles=new Set(icons.map(t=>t.value.match(/url\("([^"]+)"\)/)?.[1]).filter(Boolean));
document.querySelector('#token-status').textContent=`${primitive.length} primitive · ${semantic.length} semantic · ${iconFiles.size} локальних SVG-іконок (${icons.length} icon tokens) · ${modules.length} component modules`;
Object.assign(document.body.dataset,{tokenSource:'tokens.css',primitiveCount:String(primitive.length),semanticCount:String(semantic.length),canonicalIconCount:String(iconFiles.size),iconTokenCount:String(icons.length),moduleCount:String(modules.length)});
// Шаблони з h3 оголошено після коду, що будує h2-рівні (function hoisting): у джерелі заголовки йдуть h1 → h2 → h3.
function table(title,list){return `<section class="token-group"><h3>${title} <small>${list.length}</small></h3><div class="table-wrap"><table class="token-table"><thead><tr><th scope="col">Token</th><th scope="col">Live value</th><th scope="col">Component mapping</th></tr></thead><tbody>${list.map(t=>{const actual=resolved(t.name),icon=t.name.includes('-icon-'),color=t.name.startsWith('--color-')||t.name.includes('-gradient-');return `<tr data-token="${esc(t.name)}"><td><code>${esc(t.name)}</code></td><td><span class="token-value">${icon?`<i class="token-icon" style="--token-preview:var(${t.name})" aria-hidden="true"></i>`:color?`<i class="token-swatch" style="--token-preview:var(${t.name})" aria-hidden="true"></i>`:''}<span><code>${esc(t.value)}</code>${actual&&actual!==t.value?`<br><small>${esc(actual)}</small>`:''}</span></span></td><td>${esc(usage(t.name))}</td></tr>`}).join('')}</tbody></table></div></section>`;}
function specimens(){return `<div class="specimens" aria-label="Живі зразки токенів"><section class="specimen specimen__type"><h3>Typography</h3><strong>Зелений двір</strong><span>Jost + Golos Text · self-hosted WOFF2</span></section><section class="specimen"><h3>Spacing rhythm</h3><div class="specimen__space" aria-hidden="true"><i></i><i></i><i></i><i></i></div></section><section class="specimen"><h3>Card radius</h3><div class="specimen__radius" aria-hidden="true"></div></section></div>`;}
</script>
<script src="/kootok/course-nav.js" defer></script>
</body>
</html>
