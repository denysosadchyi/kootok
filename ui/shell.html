<title>Куток — оболонка продукту</title>
<link rel="stylesheet" href="../design-system/index.css">
<link rel="stylesheet" href="/kootok/course-nav.css">
<script src="/kootok/course-nav.js" defer></script>

<body>
<!-- Навчальна вітрина кореневого екрана: бренд-рядок, тіло й dock шукачки
     (Пошук · Чати · Профіль — як у макетах);
     production-root додає dock modifier і розрахований clearance. Вкладені екрани
     замінюють .kit-shell__brand на .kit-shell__appbar із .kit-back і не
     рендерять tabbar — один рівень шапки та одна головна дія на екран. -->
<div class="kit-shell">
  <header class="kit-shell__brand"><a href="../index.html" aria-label="Куток — на головну">Куток</a><span>Київ</span></header>
  <main class="kit-shell__body">
    <header class="kit-page-intro">
      <h1 class="kit-headline">Стрічка оголошень</h1>
      <p class="kit-meta">128 оголошень у Києві</p>
    </header>
    <section class="kit-section">
      <div class="kit-card">
        <p>Вміст екрана живе в картках. Усі блоки — з класів <code>components/</code>, а значення — із семантичних токенів; нового локального стилю на екрані не з'являється.</p>
      </div>
    </section>
    <p class="kit-footer">Куток · пошук співмешканців і кімнат у Києві</p>
  </main>
  <nav class="kit-tabbar" aria-label="Основна навігація, шукачка">
    <a class="kit-tab" href="../lesson-6/listings.html" aria-current="page">Пошук</a>
    <a class="kit-tab kit-tab--chats" href="../design-system/examples/chats.html">Чати</a>
    <a class="kit-tab kit-tab--profile" aria-disabled="true">Профіль</a>
  </nav>
</div>
</body>
</html>
