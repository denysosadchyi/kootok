# Публікує репозиторій як статичний сайт на GitHub Pages:
# https://denysosadchyi.github.io/kootok/ — базовий шлях /kootok/ збігається з
# абсолютними посиланнями сторінок. Збирання немає; симлінки (lesson-6/,
# ui/assets, handoff/voice.md, handoff/microcopy.md тощо) розгортаються у файли.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Скопіювати сайт із розгорнутими симлінками
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar --exclude=./.git --exclude=./.github -chf - . | tar -xf - -C "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
